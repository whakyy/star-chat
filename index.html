<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1730">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>StarChat</title>
<style>
:root{--bg:#14111f;--panel:#1b1730;--panel2:#241f3d;--line:#2d2750;--text:#f4f1ff;--muted:#8d86ad;--accent:#7c5cff;--pink:#ec4899;--their:#252041;--star:#ffc83d;--danger:#ef5350;--ok:#43c279;
--mine:linear-gradient(135deg,var(--accent),#c04cd9)}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f4f2fb;--panel:#ffffff;--panel2:#eeeaf9;--line:#e1dcf2;--text:#1c1833;--muted:#7a7399;--their:#ffffff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top);max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:560px){.view{border:0}}
.view.on{display:flex}
header.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:58px;flex:none}
header.bar .ttl{flex:1;min-width:0}
header.bar h1{font-size:18px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .sub.on{color:var(--accent)}
.ib{background:none;border:0;padding:8px;border-radius:50%;font-size:20px;line-height:1;width:40px;height:40px;display:grid;place-items:center;flex:none}
.ib:active{background:#8d86ad33}
.ava{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;user-select:none}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.chip{background:#ffc83d22;color:var(--star);padding:4px 10px;border-radius:14px;font-size:14px;font-weight:650;white-space:nowrap}
input,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}
.btn{background:var(--accent);border:0;border-radius:12px;padding:12px 16px;font-weight:650;color:#fff}
.btn:active{opacity:.8}.btn.gray{background:var(--panel2);color:var(--text)}.btn.red{background:var(--danger)}.btn.sm{padding:7px 12px;font-size:14px}.btn[disabled]{opacity:.5}
.link{background:none;border:0;color:var(--accent);padding:6px}
.err{color:var(--danger);text-align:center;min-height:20px;font-size:14px}
/* auth */
#auth{justify-content:center;align-items:center;padding:24px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.logo{width:84px;height:84px;border-radius:24px;margin:0 auto;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-size:44px;color:#fff;box-shadow:0 10px 30px #7c5cff55}
.card h2{text-align:center;margin:4px 0 6px;font-size:24px}
/* list */
.list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.row{display:flex;gap:12px;padding:9px 14px;align-items:center;cursor:pointer}
.row:active{background:#8d86ad22}
.row .mid{flex:1;min-width:0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .n{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{color:var(--muted);font-size:12px;flex:none}
.row .p{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:14.5px;margin-top:1px}
.row .p span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p b{color:var(--text);font-weight:500}
.badge{background:var(--accent);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font-size:13px;font-weight:650;display:grid;place-items:center;flex:none}
.tag{font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:48px 24px}
.sec{color:var(--accent);font-size:13px;font-weight:650;padding:12px 16px 4px;text-transform:uppercase;letter-spacing:.04em}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;font-size:24px;box-shadow:0 6px 20px #7c5cff66;z-index:2}
#searchbox{display:none;flex:1}#searchbox input{padding:9px 14px;border-radius:20px}
/* drawer */
.scrim{position:fixed;inset:0;background:#0009;z-index:20;display:none}
.scrim.on{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,82vw);background:var(--panel);z-index:21;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#drawer .head{padding:20px 16px;background:linear-gradient(135deg,#4b36b8,#a23fb6);color:#fff;display:flex;flex-direction:column;gap:8px}
#drawer .head .nm{font-weight:700;font-size:18px}#drawer .head .us{opacity:.8;font-size:14px}
.mi{display:flex;gap:14px;align-items:center;padding:14px 18px;background:none;border:0;width:100%;text-align:left;font-size:16px}
.mi:active{background:#8d86ad22}.mi .ic{width:24px;text-align:center;font-size:20px}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:8px 10px 6px;display:flex;flex-direction:column;overscroll-behavior:contain;background:radial-gradient(circle at 20% 0%,#7c5cff14,transparent 50%),radial-gradient(circle at 90% 90%,#ec489914,transparent 45%),var(--bg)}
.day{align-self:center;background:#8d86ad33;color:var(--muted);font-size:12.5px;padding:3px 12px;border-radius:12px;margin:10px 0 6px;font-weight:600}
.mrow{display:flex;gap:6px;align-items:flex-end;margin-top:2px}
.mrow.out{justify-content:flex-end}
.mrow.first{margin-top:8px}
.mrow .sp{width:34px;flex:none}
.m{max-width:80%;padding:6px 10px 5px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere;position:relative;min-width:60px}
.m.in{background:var(--their);border-bottom-left-radius:5px;box-shadow:0 1px 1px #0002}
.m.out{background:var(--mine);color:#fff;border-bottom-right-radius:5px}
.m .who{font-size:13.5px;font-weight:700;margin-bottom:1px}
.m .body{white-space:pre-wrap}
.m .body a{color:inherit;text-decoration:underline}
.m .meta{float:right;margin:6px 0 -2px 10px;font-size:11.5px;opacity:.7;display:flex;gap:3px;align-items:center;line-height:1}
.m .tick{letter-spacing:-3px;font-size:13px}.m .tick.r{color:#8ff0ff}
.m.deleted{opacity:.6;font-style:italic}
.m .rq{border-left:3px solid var(--accent);background:#8d86ad22;border-radius:6px;padding:3px 8px;margin:2px 0 5px;font-size:13.5px;cursor:pointer}
.m.out .rq{border-color:#fff;background:#ffffff22}
.m .rq b{display:block;color:var(--accent)}.m.out .rq b{color:#fff}
.m .rq span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.m img.pic{display:block;max-width:100%;max-height:340px;border-radius:10px;margin:2px 0 4px;cursor:zoom-in;background:#0003;min-width:140px;min-height:90px;object-fit:cover}
.m.pic-only{padding:4px}
.gcard{text-align:center;padding:10px 18px 4px;min-width:180px}
.gcard .e{font-size:64px;line-height:1.1;filter:drop-shadow(0 4px 8px #0005)}
.gcard .gn{font-weight:700;margin-top:4px}.gcard .gs{opacity:.85;font-size:13px}.gcard .gnote{margin:6px 0 2px;white-space:pre-wrap}
.stars-pill{font-weight:700;font-size:17px}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.voice .pl{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--accent);font-size:16px;flex:none}
.m.in .voice .pl{background:var(--accent);color:#fff}
.voice .wv{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.voice .wv i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.4}
.voice .wv i.f{opacity:1}
.voice .du{font-size:12.5px;opacity:.8;min-width:34px;text-align:right}
.typing{padding:0 14px 4px;color:var(--accent);font-size:13px;min-height:18px}
.bar2{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);flex:none}
.bar2 .grow{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13.5px}
.bar2 .grow b{display:block;color:var(--accent)}.bar2 .grow span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.composer{display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);align-items:flex-end;border-top:1px solid var(--line);flex:none}
.composer textarea{border-radius:22px;padding:10px 14px;max-height:130px;min-height:42px;line-height:1.3;border:0;background:var(--panel2)}
.send{background:var(--accent);border:0;border-radius:50%;width:44px;height:44px;flex:none;font-size:18px;color:#fff;display:grid;place-items:center}
.rec{flex:1;display:flex;align-items:center;gap:10px;padding:0 6px;color:var(--danger);font-weight:650}
.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#emojis{display:none;flex-wrap:wrap;gap:2px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);max-height:150px;overflow-y:auto}
#emojis.on{display:flex}#emojis button{background:none;border:0;font-size:24px;padding:4px;width:40px;height:40px}
.joinbar{padding:12px;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;color:var(--muted);text-align:center;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
/* profile pages */
.page{flex:1;overflow-y:auto;overscroll-behavior:contain}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 14px;text-align:center}
.hero .nm{font-size:22px;font-weight:700}.hero .st{color:var(--muted);font-size:14px}.hero .st.on{color:var(--accent)}
.hero .about{max-width:420px;white-space:pre-wrap}
.acts{display:flex;gap:10px;justify-content:center;padding:6px 16px 12px;flex-wrap:wrap}
.box{background:var(--panel);margin:8px 0;padding:6px 0}
.kv{padding:8px 16px}.kv small{display:block;color:var(--muted);font-size:12.5px}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:10px 14px}
.gi{background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;position:relative}
.gi .e{font-size:38px;line-height:1.1}.gi .n{font-size:12.5px;font-weight:650;margin-top:2px}.gi .s{font-size:11.5px;color:var(--muted)}
.gi.sel{outline:2px solid var(--accent);background:#7c5cff22}
.gi.out{opacity:.45}
.form{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.form label{font-size:13px;color:var(--muted);margin-bottom:-6px}
/* overlays */
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:#0008}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:86vh;overflow-y:auto;padding:6px 0 calc(14px + env(safe-area-inset-bottom));animation:up .18s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:10px 18px 8px;font-size:17px}
.sheet .pad{padding:4px 16px 8px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;padding:4px 16px}.tabs button{flex:1;background:var(--panel2);border:0;border-radius:10px;padding:9px;font-weight:650}.tabs button.on{background:var(--accent);color:#fff}
#lightbox{position:fixed;inset:0;background:#000e;z-index:40;display:none;align-items:center;justify-content:center}
#lightbox.on{display:flex}#lightbox img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none;max-width:90%;text-align:center}

:root[data-theme=dark]{--bg:#14111f;--panel:#1b1730;--panel2:#241f3d;--line:#2d2750;--text:#f4f1ff;--muted:#8d86ad;--their:#252041}
:root[data-theme=light]{--bg:#f4f2fb;--panel:#ffffff;--panel2:#eeeaf9;--line:#e1dcf2;--text:#1c1833;--muted:#7a7399;--their:#ffffff}
.view.on{animation:slidein .26s cubic-bezier(.2,.8,.2,1)}
.view.on.rev{animation:slideback .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(34px);opacity:.15}}
@keyframes slideback{from{transform:translateX(-22px);opacity:.15}}
.sheetwrap{animation:fadein .2s ease-out;transition:background .18s}
@keyframes fadein{from{background:#0000}}
.sheetwrap.closing{background:#0000;pointer-events:none}
.sheetwrap.closing .sheet{transform:translateY(60px);opacity:0;transition:transform .17s ease-in,opacity .17s ease-in}
.sheet{animation:up .28s cubic-bezier(.2,.9,.25,1.05)!important}
.toast{display:block!important;opacity:0;transform:translate(-50%,14px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.m.fresh{animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
.m{animation:none}
.mrow:not(.first) .m.in{border-top-left-radius:6px}
.mrow:not(.first) .m.out{border-top-right-radius:6px}
.mrow:has(+ .mrow:not(.first)) .m.in{border-bottom-left-radius:6px}
.mrow:has(+ .mrow:not(.first)) .m.out{border-bottom-right-radius:6px}
.day{position:sticky;top:6px;z-index:2;backdrop-filter:blur(6px)}
.sk{display:flex;gap:12px;align-items:center;padding:10px 14px}
.sk i{display:block;border-radius:50%;width:48px;height:48px;flex:none}
.sk b{display:block;height:11px;border-radius:6px;margin:5px 0}
.sk i,.sk b{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.dots span{display:inline-block;animation:dot 1.1s infinite;font-weight:700}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.btn,.mi,.row,.ib,.send{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.row.rowin{animation:rowin .32s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
.empty .bounce,.empty>div:first-child{animation:floaty 3s ease-in-out infinite}
input:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);transition:box-shadow .15s}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.send.swap{animation:swap .22s ease-out}
@keyframes swap{from{transform:scale(.6) rotate(-40deg);opacity:.3}}
@media (prefers-reduced-motion:reduce){.view.on,.sheet,.m.fresh,.row.rowin,.sk i,.sk b{animation:none!important}}
header.bar{position:relative;z-index:3;box-shadow:0 2px 14px #00000026}
.avw{position:relative;flex:none}.avw .on{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid var(--bg)}
@keyframes pop{from{transform:scale(.88) translateY(6px);opacity:0}}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 2px}
.rxc{display:inline-flex;gap:4px;align-items:center;background:#8d86ad33;border-radius:12px;padding:2px 8px;font-size:14px;cursor:pointer;border:1px solid transparent}
.m.out .rxc{background:#ffffff2e}
.rxc.mine{border-color:var(--accent);background:#7c5cff33}.m.out .rxc.mine{border-color:#fff}
.rxc b{font-size:12.5px;font-weight:650}
.m.hasrx .meta{float:none;display:flex;justify-content:flex-end;margin:2px 0 -2px}
.rxbar{display:flex;justify-content:space-around;padding:8px 10px 10px}
.rxbar button{background:none;border:0;font-size:30px;padding:4px 6px;border-radius:50%;transition:transform .12s}
.rxbar button:active{transform:scale(1.35)}.rxbar button.on{background:#7c5cff33}
.down{position:absolute;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);color:var(--text);box-shadow:0 3px 14px #0005;font-size:22px;display:none;z-index:4}
.down.on{display:grid;place-items:center}.down .badge{position:absolute;top:-9px;right:-4px}
/* подарки */
.m.giftm{padding:3px;background:transparent;box-shadow:none;max-width:88%}
.m.giftm .meta{position:absolute;right:14px;bottom:9px;float:none;margin:0;color:#fff;opacity:.9;z-index:2}
.m.giftm .rx{padding:0 6px}
.m.giftm .gc{padding-bottom:30px}
.gc{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 12px;text-align:center;color:#fff;min-width:210px;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 4px 14px #0003}
.gc .pat{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);place-items:center;opacity:.13;font-size:20px;pointer-events:none}
.gc .pat span:nth-child(even){opacity:.55;transform:scale(.8)}
.gc .big{position:relative;font-size:78px;line-height:1.1;animation:floaty 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0006)}
@keyframes floaty{50%{transform:translateY(-7px) rotate(3deg)}}
.gc .ttl{position:relative;font-weight:800;font-size:17px;margin-top:2px;text-shadow:0 1px 3px #0004}
.gc .sub{position:relative;opacity:.92;font-size:12.5px;margin-top:1px}
.gc .note{position:relative;margin-top:8px;background:#0003;border-radius:10px;padding:6px 10px;white-space:pre-wrap;font-size:14.5px}
.gc .cacts{position:relative;display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.gc .btn{background:#ffffff38;backdrop-filter:blur(6px);box-shadow:0 0 0 1px #ffffff40 inset}
.gc.uniq{box-shadow:0 0 0 2px #ffe08a inset,0 6px 20px #0004}
.gc .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-100%);animation:shine 3.4s infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(100%)}}
.gc .tagn{position:absolute;top:9px;right:9px;background:#0005;border-radius:9px;padding:1px 8px;font-size:12px;font-weight:800;z-index:2}
.gc .attrs{position:relative;display:grid;grid-template-columns:auto auto;gap:3px 14px;justify-content:center;margin-top:10px;font-size:13px;text-align:left}
.gc .attrs{text-shadow:0 1px 3px #0006}.gc .attrs b{opacity:.8;font-weight:500}
.gc.sm{padding:10px 6px 8px;min-width:0;border-radius:15px;cursor:pointer}
.gc.sm .big{font-size:44px}.gc.sm .ttl{font-size:13px}.gc.sm .sub{font-size:11.5px}.gc.sm .pat{font-size:12px}
.gc.sel{outline:3px solid var(--accent);outline-offset:2px}
.gc.out{opacity:.45;filter:grayscale(.7)}
.gifts{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.bp{position:fixed;bottom:-40px;z-index:60;pointer-events:none;animation:rise var(--d) ease-out forwards}
@keyframes rise{to{transform:translate(var(--x),-105vh) rotate(var(--r));opacity:0}}

/* анимации подарков: у каждого своя */
.gc .big{transform-origin:50% 85%}
.gc .big.an-teddy{animation:wave 1.6s ease-in-out infinite}
.gc .big.an-heart{animation:beat 1.1s ease-in-out infinite}
.gc .big.an-rose{animation:sway 2.8s ease-in-out infinite}
.gc .big.an-balloon{animation:balloon 3.4s ease-in-out infinite}
.gc .big.an-cake{animation:hop 1.3s ease-in-out infinite}
.gc .big.an-bouquet{animation:sway 3.2s ease-in-out infinite}
.gc .big.an-gem{animation:gem 2.2s ease-in-out infinite}
.gc .big.an-trophy{animation:trophy 2.4s ease-in-out infinite}
.gc .big.an-rocket{animation:fly 2.2s ease-in-out infinite}
.gc .big.an-ring{animation:spin3d 3.2s linear infinite}
.gc .big.an-crown{animation:crown 2.6s ease-in-out infinite}
.gc .big.an-comet{animation:comet 2.4s ease-in-out infinite}

<script>
'use strict';

    c.member_list ? h('div', { class: 'box' }, h('div', { class: 'sec', style: 'padding-top:6px', text: 'Участники' }), c.member_list.map((u) => h('div', { class: 'row', onclick: () => memberMenu(c, u) }, ava(u, 42), h('div', { class: 'mid' }, h('div', { class: 'n', text: u.name + (u.id === S.me.id ? ' (вы)' : '') }), h('div', { class: 'p' }, h('span', { text: u.online ? 'в сети' : '@' + u.username }))), u.role !== 'member' ? h('span', { class: 'tag', text: u.role === 'owner' ? 'владелец' : 'админ' }) : null))) : null);
  go('info');
}
function memberMenu(c, u) {
  const me = c.role;
  menuSheet(u.name, [
    u.id !== S.me.id ? { icon: '👤', text: 'Профиль', fn: () => openProfile(u.id) } : null,
    me === 'owner' && u.role !== 'owner' ? { icon: '🛡', text: u.role === 'admin' ? 'Снять админа' : 'Сделать админом', fn: async () => { try { await api('/api/chats/' + c.id + '/admin', { user: u.id, on: u.role !== 'admin' }); openInfo(c.id); } catch (e) { toast(e.message); } } } : null,
    (me === 'owner' || me === 'admin') && u.role !== 'owner' && !(u.role === 'admin' && me !== 'owner') && u.id !== S.me.id ? { icon: '🚫', text: 'Удалить из чата', danger: true, fn: async () => { try { await api('/api/chats/' + c.id + '/kick', { user: u.id }); openInfo(c.id); } catch (e) { toast(e.message); } } } : null,
  ]);
}
function editChat(c) {
  sheet('Изменить', (box, s) => {
    const t = h('input', { value: c.title, maxlength: 64 }), a = h('input', { value: c.about || '', maxlength: 200, placeholder: 'Описание' });
    box.append(h('div', { class: 'pad' }, t, a, h('button', { class: 'btn', text: 'Сохранить', onclick: async () => { try { await api('/api/chats/' + c.id + '/edit', { title: t.value, about: a.value }); s.close(); openInfo(c.id); loadChats(); if (S.cur && S.cur.id === c.id) { S.cur.title = t.value; drawChatHeader(); } } catch (e) { toast(e.message); } } })));
  });
}
function addMember(c) {
  sheet('Добавить участника', (box, s) => {
    const u = h('input', { placeholder: 'Логин пользователя', autocapitalize: 'off' });
    box.append(h('div', { class: 'pad' }, u, h('button', { class: 'btn', text: 'Добавить', onclick: async () => { try { await api('/api/chats/' + c.id + '/add', { username: u.value }); s.close(); openInfo(c.id); toast('Добавлен'); } catch (e) { toast(e.message); } } })));
  });
}
function leaveChat(c) {
  sheet(c.type === 'channel' ? 'Отписаться от канала?' : 'Покинуть группу?', (box, s) => box.append(h('div', { class: 'pad' }, h('button', { class: 'btn red', text: 'Да, выйти', onclick: async () => { try { await api('/api/chats/' + c.id + '/leave', {}); s.close(); await unwind(); loadChats(); } catch (e) { toast(e.message); } } }), h('button', { class: 'btn gray', text: 'Отмена', onclick: () => s.close() }))));
}

// ---------- realtime ----------
function connect() {
  if (S.es) S.es.close();
  const es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));
  S.es = es;
  es.onerror = () => { if (es.readyState === 2 && S.token && S.es === es) setTimeout(() => S.token && S.es === es && connect(), 3000); };
  es.onmessage = (e) => {
    const d = JSON.parse(e.data), c = S.cur;
    if (d.type === 'banned') return logout(true);
    if (d.type === 'balance') return setStars(d.stars);
    if (d.type === 'chats') { loadChats(); if (c) api('/api/chats/' + c.id).then((x) => { if (S.cur && S.cur.id === x.id) { Object.assign(S.cur, x); drawChatHeader(); } }).catch(() => {}); return; }
    if (d.type === 'message') {
      if (c && c.id === d.chat_id) { addMessage(d.msg); if (!d.msg.mine) { markRead(); setTyping(''); if (d.msg.kind === 'gift' && d.msg.gift) burst([d.msg.gift.emoji, '✨'], 22); } }
      else if (!d.msg.mine) toast(d.msg.from.name + ': ' + previewOf(d.msg));
      loadChats();
    }
    if (d.type === 'edit' && c && c.id === d.chat_id) replaceBubble(d.msg);
    if (d.type === 'delete' && c && c.id === d.chat_id) { const m = S.msgs.find((x) => x.id === d.id); if (m) { m.kind = 'deleted'; m.text = ''; m.media = null; renderAll(false); } loadChats(); }
    if (d.type === 'read' && c && c.id === d.chat_id) { c.peer_read = Math.max(c.peer_read || 0, d.upto); document.querySelectorAll('[data-tick]').forEach((t) => { if (+t.dataset.tick <= c.peer_read) { t.textContent = '✓✓'; t.classList.add('r'); } }); loadChats(); }
    if (d.type === 'typing' && c && c.id === d.chat_id) { setTyping(c.type === 'direct' ? 'печатает' : d.user.name + ' печатает'); clearTimeout(S.typingT); S.typingT = setTimeout(() => setTyping(''), 4000); }
  };
}

// ---------- запуск ----------
async function boot() {
  try { const cfg = await fetch('/api/config').then((r) => r.json()); S.cfg = cfg; document.documentElement.style.setProperty('--accent', cfg.accent); $('appname').textContent = cfg.name; $('mainName').textContent = cfg.name; document.title = cfg.name; } catch {}
  if (!S.token) return logout(true);
  try { S.me = await api('/api/me'); } catch { return logout(true); }
  stack = [{ name: 'main', page: true }]; history.replaceState({ n: 1 }, '');
  setStars(S.me.stars); showPage(); skeletonList(); loadChats(); connect();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
